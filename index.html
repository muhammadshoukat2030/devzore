<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =====================================================
         FAVICONS
    ====================================================== -->

    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <link
      rel="manifest"
      href="/site.webmanifest"
    />

    <!-- =====================================================
         BROWSER / MOBILE
    ====================================================== -->

    <meta
      name="theme-color"
      content="#030303"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <!-- =====================================================
         CONNECTION OPTIMIZATION
    ====================================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      rel="dns-prefetch"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://cdn.jsdelivr.net"
      crossorigin
    />

    <!-- =====================================================
         DEVICON
    ====================================================== -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    />

    <!-- =====================================================
         ORGANIZATION STRUCTURED DATA
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://devzore.com/#organization",
        "name": "DevZore",
        "url": "https://devzore.com/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://devzore.com/logo.png"
        },
        "description": "DevZore is a software development agency providing web development, mobile application development, SaaS development, UI/UX design and digital solutions for businesses worldwide.",
        "founder": {
          "@type": "Person",
          "name": "Muhammad Shoukat"
        },
        "areaServed": "Worldwide",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "email": "hellodevzore@gmail.com",
          "telephone": "+92-334-8004300",
          "availableLanguage": [
            "English",
            "Urdu"
          ]
        },
        "sameAs": [
          "https://github.com/muhammadshoukat2030",
          "https://www.linkedin.com/in/dev-zore-833893418",
          "https://www.instagram.com/devz.ore/"
        ]
      }
    </script>

    <!-- =====================================================
         WEBSITE STRUCTURED DATA
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://devzore.com/#website",
        "url": "https://devzore.com/",
        "name": "DevZore",
        "description": "Software development, web applications, SaaS products, mobile apps and digital solutions for businesses worldwide.",
        "publisher": {
          "@id": "https://devzore.com/#organization"
        },
        "inLanguage": "en"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <noscript>
      <div
        style="
          max-width: 760px;
          margin: 60px auto;
          padding: 24px;
          text-align: center;
          font-family: Arial, sans-serif;
        "
      >
        <h1>DevZore Software Development Agency</h1>

        <p>
          DevZore provides web development, SaaS development,
          mobile application development, UI/UX design and
          custom software solutions for businesses worldwide.
        </p>

        <p>
          JavaScript is required to use all features of this website.
        </p>
      </div>
    </noscript>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
